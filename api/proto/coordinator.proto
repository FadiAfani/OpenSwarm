syntax = "proto3";

package openswarm.api;

option go_package = "openswarm/api/gen";


import "api/proto/types.proto";

service CoordinatorService {
    rpc InitializeTask(InitTaskRequest) returns (InitTaskResponse);
    rpc RelayForward(RelayRequest) returns (RelayResponse);
    rpc GetCoordinatorHealth(GetCoordinatorHealthRequest) returns (CoordinatorHealthResponse);
    rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);
    rpc UnregisterWorker(UnregisterWorkerRequest) returns (UnregisterWorkerResponse);
    rpc GetWorker(GetWorkerRequest) returns (GetWorkerResponse);
    rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
}

message InitTaskRequest {
    string session_id = 1;
    string prompt = 2;
    string model_id = 3;
}

message InitTaskResponse{

}

message RelayRequest {
    Vector vector = 1;
    string workder_id = 2;

}

message RelayResponse {}

message GetCoordinatorHealthRequest {}

message CoordinatorHealthResponse {
    bool status = 1;
    string latency = 2;
}

message RegisterWorkerRequest {
  string worker_id = 1;
  string gpu_model = 2;
  int32 vram = 3;
  string coordinator_id = 4;
}

message RegisterWorkerResponse {
  bool accepted = 1;
}

message UnregisterWorkerRequest {
  string worker_id = 1;
}

message UnregisterWorkerResponse {}

message GetWorkerRequest {
  string worker_id = 1;
}

message GetWorkerResponse {
  bool found = 1;
  string worker_id = 2;
  string gpu_model = 3;
  int32 vram = 4;
  string coordinator_id = 5;
}

message ListWorkersRequest {
  bool online_only = 1;
}

message ListWorkersResponse {
  repeated Worker workers = 1;
}
